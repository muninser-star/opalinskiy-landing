<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#292640">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; manifest-src 'self'; img-src 'self'; base-uri 'none'">
  <title>Расшифровка — нет интернета</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #f7f5fb;
      color: #292640;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 420px; }
    h1 { margin: 0 0 16px; font-size: 28px; line-height: 1.2; }
    p { margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      background: #292640;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #906ad6; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Нет подключения к интернету</h1>
    <p>Для распознавания аудио и саммори встреч нужен интернет. Подключитесь к сети и откройте расшифровку снова.</p>
    <a href="/transcript/">Открыть расшифровку</a>
  </main>
</body>
</html>
